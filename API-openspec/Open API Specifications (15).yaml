      summary: "API 362 accountLienEnquirytest - 1.0.0 ( Development )"
      description: "In order to reduce risk on the money lent to DSAs for recharging Fast Tags, the bank wants to add Liens for every transaction a DSA does. This API service will be called to enquire and fetch lien details of a DSA Worldline accounts using account Id and lien module type for which the lien is maintained."
